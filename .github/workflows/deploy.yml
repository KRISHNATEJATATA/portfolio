name: Deploy to Vercel

# Builds in CI with NEXT_PUBLIC_CONTACT_ENDPOINT injected from GitHub Secrets,
# then uploads the prebuilt output — so the value is baked into the bundle
# exactly once, from one source of truth.

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-production-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    env:
      # vercel pull uses these two to link to the project without a local
      # .vercel/project.json committed to the repo.
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check required Vercel secrets are present
        env:
          CHECK_VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          CHECK_VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          CHECK_VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          fail=0
          for entry in \
            "CHECK_VERCEL_TOKEN:VERCEL_TOKEN" \
            "CHECK_VERCEL_ORG_ID:VERCEL_ORG_ID" \
            "CHECK_VERCEL_PROJECT_ID:VERCEL_PROJECT_ID"; do
            var="${entry%%:*}"; name="${entry##*:}"
            if [ -z "$(printenv "$var")" ]; then
              echo "::error::GitHub secret '${name}' is missing or empty. Add it under Settings > Secrets and variables > Actions (repository secrets)."
              fail=1
            fi
          done
          exit $fail

      - name: Pull Vercel production project settings
        run: npx --yes vercel@latest pull --yes --environment=production --token "${{ secrets.VERCEL_TOKEN }}"

      - name: Build production artifacts
        run: npx --yes vercel@latest build --prod --token "${{ secrets.VERCEL_TOKEN }}"
        env:
          # Inlined by next build at compile time. Unset/empty -> the site
          # gracefully renders the mailto fallback instead of the form.
          NEXT_PUBLIC_CONTACT_ENDPOINT: ${{ secrets.NEXT_PUBLIC_CONTACT_ENDPOINT }}

      - name: Deploy prebuilt output to production
        run: npx --yes vercel@latest deploy --prebuilt --prod --token "${{ secrets.VERCEL_TOKEN }}"
