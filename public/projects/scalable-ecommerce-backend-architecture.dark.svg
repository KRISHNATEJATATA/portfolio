<?xml version="1.0" encoding="utf-8"?><svg viewBox="0 0 1304 648" width="1304" height="648" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ecommerce-dark-title ecommerce-dark-desc">
    <title id="ecommerce-dark-title">Scalable e-commerce backend architecture</title>
    <desc id="ecommerce-dark-desc">Architecture of a scalable FastAPI e-commerce backend showing synchronous HTTP requests flowing through middleware, Keycloak OIDC authentication, routes, schemas, services, and repositories to PostgreSQL, alongside Valkey caching, S3 storage, a transactional outbox relay emitting to SNS and SQS, and three asynchronous background workers for images, cache invalidation, and reservation reaping.</desc>
    <defs>
      <marker id="ecommerce-dark-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#a8a29e"/></marker>
      <marker id="ecommerce-dark-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#f59e0b"/></marker>
    </defs>

    <!-- Editorial aside: Synchronous critical path vs async event bus -->
    <text x="48" y="44" fill="#a8a29e" font-size="14" font-style="italic" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">synchronous request path guarantees transactional outbox delivery before async fan-out</text>

