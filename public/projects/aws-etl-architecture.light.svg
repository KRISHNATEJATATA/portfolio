<?xml version="1.0" encoding="utf-8"?><svg viewBox="0 0 1040 480" width="1040" height="480" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="aws-light-title aws-light-desc">
    <title id="aws-light-title">AWS ETL pipeline architecture</title>
    <desc id="aws-light-desc">Architecture of an AWS serverless ETL pipeline showing CSV enterprise data uploaded to a private S3 source bucket, crawled by AWS Glue to populate the Glue Data Catalog, transformed by a visual Glue ETL job authorized by an IAM Glue role into a curated S3 target bucket, and queried via Amazon Athena.</desc>
    <defs>
      <marker id="aws-light-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#6f6a60"/></marker>
      <marker id="aws-light-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="#b45309"/></marker>
    </defs>

    <!-- Editorial aside: Code-wired infrastructure -->
    <text x="320" y="92" fill="#6f6a60" font-size="14" font-style="italic" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">provisioned by etl.py (boto3); crawl, job, and query run on-demand</text>
    <line x1="520" y1="102" x2="520" y2="144" stroke="rgba(28,27,24,0.18)" stroke-width="0.8"/>

    <!-- Arrows first (behind boxes) -->
    <!-- Critical path (accent) -->
    <line x1="176" y1="200" x2="240" y2="200" stroke="#b45309" stroke-width="1.4" marker-end="url(#aws-light-arrow-accent)"/>
    <path d="M 312,232 V 352 Q 312,360 320,360 H 448" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#aws-light-arrow-accent)"/>
    <path d="M 712,232 V 288 Q 712,296 704,296 H 536 Q 528,296 528,304 V 320" fill="none" stroke="#b45309" stroke-width="1.4" marker-end="url(#aws-light-arrow-accent)"/>
    <line x1="608" y1="360" x2="688" y2="360" stroke="#b45309" stroke-width="1.4" marker-end="url(#aws-light-arrow-accent)"/>

    <!-- Neutral / side connections -->
    <line x1="384" y1="200" x2="448" y2="200" stroke="#6f6a60" stroke-width="1" marker-end="url(#aws-light-arrow)"/>
    <line x1="576" y1="200" x2="640" y2="200" stroke="#6f6a60" stroke-width="1" marker-end="url(#aws-light-arrow)"/>
    <line x1="784" y1="200" x2="864" y2="200" stroke="#6f6a60" stroke-width="1" marker-end="url(#aws-light-arrow)"/>
    <path d="M 928,232 V 344 Q 928,352 920,352 H 832" fill="none" stroke="#6f6a60" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aws-light-arrow)"/>

    <!-- IAM role permissions (dashed) -->
    <line x1="368" y1="360" x2="448" y2="360" stroke="#6f6a60" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aws-light-arrow)"/>
    <path d="M 304,320 V 276 Q 304,268 312,268 H 504 Q 512,268 512,260 V 232" fill="none" stroke="#6f6a60" stroke-width="1" stroke-dasharray="4,3" marker-end="url(#aws-light-arrow)"/>

    <!-- Arrow labels — masked, 8px gap above stroke -->
    <rect x="184" y="180" width="48" height="12" rx="2" fill="#f7f5f0"/>
    <text x="208" y="189" fill="#b45309" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">UPLOAD</text>

    <rect x="392" y="180" width="48" height="12" rx="2" fill="#f7f5f0"/>
    <text x="416" y="189" fill="#6f6a60" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">INSPECT</text>

    <rect x="584" y="180" width="48" height="12" rx="2" fill="#f7f5f0"/>
    <text x="608" y="189" fill="#6f6a60" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">CATALOG</text>

    <rect x="380" y="340" width="56" height="12" rx="2" fill="#f7f5f0"/>
    <text x="408" y="349" fill="#b45309" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">READ RAW</text>

    <rect x="588" y="276" width="60" height="12" rx="2" fill="#f7f5f0"/>
    <text x="618" y="285" fill="#b45309" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">META REF</text>

    <rect x="616" y="340" width="64" height="12" rx="2" fill="#f7f5f0"/>
    <text x="648" y="349" fill="#b45309" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">CURATED</text>

    <rect x="800" y="180" width="48" height="12" rx="2" fill="#f7f5f0"/>
    <text x="824" y="189" fill="#6f6a60" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">SCHEMA</text>

    <rect x="856" y="332" width="56" height="12" rx="2" fill="#f7f5f0"/>
    <text x="884" y="341" fill="#6f6a60" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.06em">SELECT</text>

    <!-- ASSUME label removed: it shared y=340 with READ RAW and the two paper masks overlapped (388,340 40x12 & 360,340 56x12), and the 360 mask clipped the IAM node (240,320) by 8px. The dashed style + IAM "Service Role" sublabel convey role assumption. -->

    <!-- Node 1: CSV source (input) -->
    <rect x="48" y="168" width="128" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="48" y="168" width="128" height="64" rx="6" fill="rgba(111,106,96,0.10)" stroke="rgba(28,27,24,0.55)" stroke-width="1"/>
    <rect x="56" y="176" width="28" height="12" rx="2" fill="transparent" stroke="rgba(28,27,24,0.30)" stroke-width="0.8"/>
    <text x="70" y="185" fill="rgba(28,27,24,0.55)" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">RAW</text>
    <text x="112" y="204" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">enterprise.csv</text>
    <text x="112" y="220" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">boto3 upload</text>

    <!-- Node 2: S3 source bucket (store) -->
    <rect x="240" y="168" width="144" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="240" y="168" width="144" height="64" rx="6" fill="rgba(28,27,24,0.05)" stroke="#6f6a60" stroke-width="1"/>
    <rect x="248" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(111,106,96,0.50)" stroke-width="0.8"/>
    <text x="266" y="185" fill="#6f6a60" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">S3 RAW</text>
    <text x="312" y="204" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">S3 Source Bucket</text>
    <text x="312" y="220" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">s3_etl_source (private)</text>

    <!-- Node 3: Glue crawler (backend) -->
    <rect x="448" y="168" width="128" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="448" y="168" width="128" height="64" rx="6" fill="#efede6" stroke="#1c1b18" stroke-width="1"/>
    <rect x="456" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,27,24,0.40)" stroke-width="0.8"/>
    <text x="474" y="185" fill="rgba(28,27,24,0.55)" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">CRAWL</text>
    <text x="512" y="204" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Glue Crawler</text>
    <text x="512" y="220" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">schema discovery</text>

    <!-- Node 4: Glue Data Catalog (store) -->
    <rect x="640" y="168" width="144" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="640" y="168" width="144" height="64" rx="6" fill="rgba(28,27,24,0.05)" stroke="#6f6a60" stroke-width="1"/>
    <rect x="648" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(111,106,96,0.50)" stroke-width="0.8"/>
    <text x="666" y="185" fill="#6f6a60" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">META</text>
    <text x="712" y="204" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Glue Data Catalog</text>
    <text x="712" y="220" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">etl-project db</text>

    <!-- Node 5: Glue ETL Job (Focal) -->
    <rect x="448" y="320" width="160" height="80" rx="6" fill="#f7f5f0"/>
    <rect x="448" y="320" width="160" height="80" rx="6" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
    <rect x="456" y="328" width="36" height="12" rx="2" fill="transparent" stroke="rgba(180,83,9,0.50)" stroke-width="0.8"/>
    <text x="474" y="337" fill="#b45309" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">ETL</text>
    <text x="528" y="360" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Glue Visual ETL Job</text>
    <text x="528" y="376" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">Spark transform pipeline</text>

    <!-- Node 6: S3 Curated Target (store) -->
    <rect x="688" y="320" width="144" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="688" y="320" width="144" height="64" rx="6" fill="rgba(28,27,24,0.05)" stroke="#6f6a60" stroke-width="1"/>
    <rect x="696" y="328" width="40" height="12" rx="2" fill="transparent" stroke="rgba(111,106,96,0.50)" stroke-width="0.8"/>
    <text x="716" y="337" fill="#6f6a60" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">CURATED</text>
    <text x="760" y="356" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">S3 Curated Bucket</text>
    <text x="760" y="372" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">parquet analytics target</text>

    <!-- Node 7: Athena (query / backend) -->
    <rect x="864" y="168" width="128" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="864" y="168" width="128" height="64" rx="6" fill="#efede6" stroke="#1c1b18" stroke-width="1"/>
    <rect x="872" y="176" width="36" height="12" rx="2" fill="transparent" stroke="rgba(28,27,24,0.40)" stroke-width="0.8"/>
    <text x="890" y="185" fill="rgba(28,27,24,0.55)" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">SQL</text>
    <text x="928" y="204" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">Amazon Athena</text>
    <text x="928" y="220" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">ad-hoc query engine</text>

    <!-- Node 8: IAM Glue Role (security boundary) -->
    <rect x="240" y="320" width="128" height="64" rx="6" fill="#f7f5f0"/>
    <rect x="240" y="320" width="128" height="64" rx="6" fill="rgba(180,83,9,0.05)" stroke="rgba(180,83,9,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <rect x="248" y="328" width="36" height="12" rx="2" fill="transparent" stroke="rgba(180,83,9,0.30)" stroke-width="0.8"/>
    <text x="266" y="337" fill="rgba(180,83,9,0.70)" font-size="7" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle" letter-spacing="0.08em">IAM</text>
    <text x="304" y="356" fill="#1c1b18" font-size="12" font-weight="600" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif" text-anchor="middle">IAM Service Role</text>
    <text x="304" y="372" fill="#6f6a60" font-size="9" font-family="ui-monospace, 'Satoshi', monospace" text-anchor="middle">Glue + S3 full access</text>

    <!-- Legend strip -->
    <line x1="40" y1="416" x2="1000" y2="416" stroke="rgba(28,27,24,0.12)" stroke-width="0.8"/>
    <text x="40" y="432" fill="#6f6a60" font-size="8" font-family="ui-monospace, 'Satoshi', monospace" letter-spacing="0.18em">LEGEND</text>
    <rect x="40" y="444" width="14" height="10" rx="2" fill="rgba(180,83,9,0.10)" stroke="#b45309" stroke-width="1"/>
    <text x="60" y="452" fill="#6f6a60" font-size="8" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">Focal ETL Engine</text>
    <rect x="176" y="444" width="14" height="10" rx="2" fill="rgba(28,27,24,0.05)" stroke="#6f6a60" stroke-width="1"/>
    <text x="196" y="452" fill="#6f6a60" font-size="8" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">Catalog / S3 Store</text>
    <rect x="320" y="444" width="14" height="10" rx="2" fill="#efede6" stroke="#1c1b18" stroke-width="1"/>
    <text x="340" y="452" fill="#6f6a60" font-size="8" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">Crawler / Query Engine</text>
    <rect x="480" y="444" width="14" height="10" rx="2" fill="rgba(180,83,9,0.05)" stroke="rgba(180,83,9,0.50)" stroke-width="1" stroke-dasharray="4,4"/>
    <text x="500" y="452" fill="#6f6a60" font-size="8" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">IAM Policy Boundary</text>
    <line x1="636" y1="449" x2="668" y2="449" stroke="#b45309" stroke-width="1.4" marker-end="url(#aws-light-arrow-accent)"/>
    <text x="676" y="452" fill="#6f6a60" font-size="8" font-family="Satoshi, ui-sans-serif, system-ui, sans-serif">ETL Data Flow</text>
  </svg>
